<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Google tag: loads only after consent (see /gtag-init.js) -->
    <script src="/gtag-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NatureGram: AI field guide & nature community</title>
    <meta name="description" content="Point your camera at nature and a live AI naturalist tells you what you're seeing and why it behaves that way. Keep a field journal and share discoveries with explorers worldwide." />

    <link rel="canonical" href="https://thenaturegram.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NatureGram" />
    <meta property="og:url" content="https://thenaturegram.com/" />
    <meta property="og:title" content="NatureGram: AI field guide & nature community" />
    <meta property="og:description" content="Identify species, understand behaviour, and share discoveries with a global community of naturalists." />
    <meta property="og:image" content="https://thenaturegram.com/og-default.jpg?v=2" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NatureGram: AI field guide & nature community" />
    <meta name="twitter:description" content="Identify species, understand behaviour, and share discoveries with a global community of naturalists." />
    <meta name="twitter:image" content="https://thenaturegram.com/og-default.jpg?v=2" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "NatureGram",
      "url": "https://thenaturegram.com/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web, iOS, Android",
      "description": "A live AI field guide and community for identifying species and understanding animal behaviour.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#fcfaf8" />
    <!-- The fortnight's palette, worked out from the date before the first paint (see vite.config.ts) -->
    <script src="/theme-init.js"></script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NatureGram" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
    <!-- The feed's first page starts downloading with the page itself -->
    <link rel="preload" href="/api/feed/first" as="fetch" crossorigin="anonymous">
    <!-- Fonts never block the first paint: text shows at once in a fallback face and swaps in -->
    <link data-async-css href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print">
    <script src="/async-css.js"></script>
    <noscript><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
  </head>
  <body class="font-body">
    <div id="root"></div>
    <noscript>NatureGram needs JavaScript to run.</noscript>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
