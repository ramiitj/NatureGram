<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Off the trail · NatureGram</title><meta name="robots" content="noindex"><link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcfaf8;--paper:#fbf7ef;--rule:#e8dfcd;--rule-strong:#d8ccb6;--ink:#1c1917;--text:#44403c;--muted:#78716c;--sepia:#8a7a60;--accent:#c2410c;--primary:#44403c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 20px 32px}
.top{width:100%;max-width:720px;margin:0 auto}
.mark{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--ink);text-decoration:none;font-family:"Newsreader",Georgia,serif;font-size:20px;font-weight:600}
.mark svg{width:26px;height:26px;color:var(--accent)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 0}
.page{position:relative;width:100%;max-width:420px;background:var(--paper);border-radius:3px;padding:12px;box-shadow:0 1px 2px rgba(60,40,20,.12),0 10px 30px -12px rgba(60,40,20,.3);text-align:center}
.frame{border:1px solid var(--rule-strong);outline:1px solid var(--rule);outline-offset:3px;border-radius:2px;padding:36px 24px 28px}
.glyph{width:64px;height:64px;color:var(--accent)}
.no{margin:14px 0 0;color:var(--sepia);font-size:13px;font-family:"Newsreader",Georgia,serif;font-style:italic}
h1{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:34px;line-height:1.15;color:var(--ink);margin:4px 0 10px}
p.lede{color:var(--text);max-width:22rem;margin:0 auto 26px;line-height:1.65;font-size:16px}
.actions{display:flex;flex-direction:column;gap:10px;align-items:center}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 26px;border-radius:999px;background:var(--primary);color:#fff;text-decoration:none;font-weight:600;font-size:15px}
a.btn:hover{opacity:.9}
a.quiet{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}
a.quiet:hover{text-decoration:underline;text-underline-offset:3px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:999px}
</style></head><body>
