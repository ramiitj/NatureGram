<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Off the trail · NatureGram</title><meta name="robots" content="noindex"><link rel="icon" href="/icon.svg">

<style>
:root{--bg:#fcfaf8;--paper:#fbf7ef;--rule:#e8dfcd;--rule-strong:#d8ccb6;--ink:#1c1917;--text:#44403c;--muted:#78716c;--sepia:#8a7a60;--accent:#292524;--primary:#44403c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 24px 40px}
.top{width:100%;max-width:960px;margin:0 auto}
.mark{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:var(--ink);text-decoration:none;font-family:"Newsreader",Georgia,serif;font-size:22px;font-weight:400;font-style:italic;letter-spacing:-.01em}
.mark svg{width:22px;height:22px;color:var(--ink)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 0}
.page{position:relative;width:100%;max-width:440px;text-align:center}
.frame{padding:24px 0}
.glyph{width:40px;height:40px;color:#a8a29e}
.no{display:flex;align-items:center;justify-content:center;gap:12px;margin:24px 0 0;color:var(--muted);font-size:14px}.no:before{content:"";display:block;width:32px;height:1px;background:var(--muted)}
h1{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:400;font-size:40px;line-height:1.12;color:var(--ink);margin:12px 0 12px;letter-spacing:-.01em}
p.lede{color:var(--text);max-width:22rem;margin:0 auto 32px;line-height:1.65;font-size:16px}
.actions{display:flex;flex-direction:column;gap:16px;align-items:center}
a.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 24px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;font-size:15px;transition:background-color .2s}
a.btn:hover{background:#292524}
a.quiet{display:inline-flex;align-items:center;min-height:44px;color:var(--text);font-weight:600;font-size:14px;text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:5px}
a.quiet:hover{color:var(--ink);text-decoration-color:var(--ink)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:999px}
</style></head><body>
