name: Nightly Eval

# Identification-quality signal (see evals/README.md), not correctness of
# the app itself — runs on a cadence rather than per-PR since it makes real
# Gemini calls (cost + latency per fixture, not something to gate every PR
# on).
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run eval harness
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run eval

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/
